<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WarehouseTwin - Nhập lô hàng</title>
  <link rel="stylesheet" href="/src/css/base.css" />
  <link rel="stylesheet" href="/src/css/receive.css" />
</head>
<body>
  <header class="topbar" id="topbar"></header>

  <main class="page-content">
    <h1>Nhập lô hàng</h1>
    <p class="hint">
      Lập lô trước: mỗi dòng là một nhóm pallet cùng số đo (dài, rộng, cao bằng mét; kg có thể để trống).
      Type A, B… do hệ thống tự khớp hoặc tạo. Bấm "Kiểm tra các kho" để xem kho nào nhận được.
    </p>

    <!-- Các dòng nhập: JS thêm/xoá hàng trong <tbody> -->
    <table class="lines">
      <thead>
        <tr>
          <th title="Số pallet">SL</th>
          <th title="Chiều dài (m)">Dài</th>
          <th title="Chiều rộng (m)">Rộng</th>
          <th title="Chiều cao (m)">Cao</th>
          <th title="Khối lượng một pallet (kg), để trống nếu không kiểm tra tải">kg</th>
          <th>Loại hàng</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="lines"></tbody>
    </table>

    <div class="actions">
      <button type="button" id="btnAddLine">+ Thêm dòng</button>
      <button type="button" id="btnSample">Lô ví dụ 6A + 2B</button>
      <button type="button" id="btnB36">Lô b36 (bài test)</button>
      <button type="button" id="btnRandom">Sinh ngẫu nhiên 30 pallet</button>
      <button type="button" id="btnCheck" class="primary">Kiểm tra các kho</button>
    </div>

    <div id="checkResult"></div>   <!-- kết quả kiểm tra -->
    <div id="outcome"></div>       <!-- kết quả sau khi nhập và xếp -->

    <!-- Thêm loại hàng mới (ốc vít, bánh xe…) -->
    <form class="inline-form" id="typeForm" autocomplete="off">
      <strong>Loại hàng mới</strong>
      <input name="code" placeholder="Mã (OV)" maxlength="20" required />
      <input name="name" placeholder="Tên (Ốc vít)" maxlength="50" required />
      <button type="submit">Thêm</button>
    </form>
  </main>

  <footer class="statusbar"><span id="status-message"></span></footer>

  <script type="module" src="/src/pages/receive.js"></script>
</body>
</html>
