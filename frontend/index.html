<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WarehouseTwin</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <strong class="brand">WarehouseTwin</strong>
      <nav class="steps" id="steps" aria-label="Các bước">
        <button type="button" data-step="layout">1. Mặt bằng</button>
        <button type="button" data-step="warehouse">2. Kho 3D và nhập hàng</button>
      </nav>
      <span id="api-status" class="api-status">Đang kết nối API…</span>
    </header>

    <div class="workspace" id="workspace">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="stage">
        <section class="view" id="view-layout">
          <div class="room-list" id="room-list"></div>
          <div class="room-editor" id="room-editor">
            <div class="room-header">
              <button type="button" id="back-to-rooms">← Danh sách phòng</button>
              <strong id="room-title"></strong>
            </div>
            <div class="toolbar" id="toolbar-2d"></div>
            <div class="canvas-wrap" id="editor2d"></div>
          </div>
        </section>
        <section class="view" id="view-warehouse" hidden>
          <div class="canvas-wrap" id="viewport3d"></div>
          <aside class="receive-dock receive" id="receive-root" aria-label="Nhập hàng"></aside>
        </section>
      </main>
    </div>

    <footer class="statusbar">
      <span id="status-message"></span>
      <span id="status-cursor"></span>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
